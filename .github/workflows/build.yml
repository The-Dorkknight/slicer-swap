name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
        include:
          - os: ubuntu-22.04      # oldest supported Python
            python: "3.8"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m slicerswap --version
      - run: python -m slicerswap list
      - name: Launchers present, executable and with the right line endings
        shell: bash
        run: |
          test "$(git ls-files -s SlicerSwap-Linux.sh | cut -c1-6)" = "100755"
          test "$(git ls-files -s SlicerSwap-Mac.command | cut -c1-6)" = "100755"
          test -f SlicerSwap-Windows.bat
          sh -n SlicerSwap-Linux.sh
          bash -n SlicerSwap-Mac.command
