name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source zip
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) TAG="v0.2.2-wip" ;; esac
          git archive --format=zip --prefix=slicer-swap/ -o "slicer-swap-${TAG}.zip" HEAD
          cp docs/SlicerSwap-Guide.pdf "SlicerSwap-Guide-${TAG}.pdf"
          sha256sum slicer-swap-*.zip SlicerSwap-Guide-*.pdf > SHA256SUMS.txt
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
          gh release create "$TAG" slicer-swap-*.zip SlicerSwap-Guide-*.pdf SHA256SUMS.txt --prerelease \
            --title "SlicerSwap $TAG (work in progress)" \
            --notes "Work in progress. MANY FEATURES MAY BE BROKEN. Check converted presets before printing; a restore changes your slicer settings folder. Unzip and double-click the SlicerSwap launcher for your system. The PDF guide holds the README, how it works and the full change log."
